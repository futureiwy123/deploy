<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 35b - Đồng Hồ Đếm Ngược</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .timer-card {
            background: white;
            padding: 35px 40px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
        }
        #timer-display {
            font-size: 64px;
            font-weight: bold;
            color: #0056b3;
            margin: 20px 0;
            letter-spacing: 3px;
            transition: color 0.3s;
        }
        /* Animation nhấp nháy cảnh báo khi thời gian dưới 1 phút (< 60s) */
        .warning-pulse {
            color: #d32f2f !important;
            animation: pulseAnim 1s infinite ease-in-out;
        }
        @keyframes pulseAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.65; }
            100% { transform: scale(1); opacity: 1; }
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #start-btn { background-color: #28a745; }
        #pause-btn { background-color: #ffc107; color: #222; }
        #reset-btn { background-color: #6c757d; }

        /* Modal Alert thông báo hết giờ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 25px 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: popIn 0.25s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box h3 {
            margin-top: 0;
            color: #d32f2f;
            font-size: 22px;
        }
        .modal-box button {
            background-color: #0056b3;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="timer-card">
        <h2>ĐỒNG HỒ ĐẾM NGƯỢC</h2>
        <div id="timer-display">10:00</div>
